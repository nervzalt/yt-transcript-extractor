<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Transcript Extractor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg: #0a0a0b;
    --surface: #131316;
    --surface-hi: #1a1a1f;
    --border: #26262b;
    --border-hi: #3a3a42;
    --text: #e8e8ea;
    --text-dim: #8a8a92;
    --text-faint: #5a5a62;
    --accent: #00e585;
    --accent-dim: #00b36a;
    --danger: #ff5555;
    --warn: #ffb347;
    --info: #5dade2;
  }
  
  body {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px;
  }
  
  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 20px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .logo-mark {
    width: 24px;
    height: 24px;
    background: var(--accent);
    color: #000;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
  }
  .version {
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  
  /* Panels */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .panel-head {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .panel-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .panel-body { padding: 18px; }
  
  /* Textarea */
  textarea {
    width: 100%;
    min-height: 150px;
    max-height: 300px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s;
  }
  textarea:focus { border-color: var(--accent-dim); }
  textarea::placeholder { color: var(--text-faint); line-height: 1.7; }
  
  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: transparent;
    border: 1px solid var(--border-hi);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
  }
  .btn:hover { background: var(--surface-hi); border-color: var(--text-dim); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
  .btn.primary {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn.primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); }
  .btn.sm { padding: 5px 10px; font-size: 11px; }
  .btn.ghost { border-color: var(--border); color: var(--text-dim); }
  .btn.ghost:hover { color: var(--text); }
  
  /* Hint text */
  .hint {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 10px;
    line-height: 1.6;
  }
  .hint strong { color: var(--text-dim); font-weight: 500; }
  
  /* Stats row */
  .stats {
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 11px;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-dim);
  }
  .stat .val { color: var(--text); font-weight: 600; }
  .stat.ok .val { color: var(--accent); }
  .stat.err .val { color: var(--danger); }
  .stat .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  
  /* Progress */
  .progress {
    height: 2px;
    background: var(--bg);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }
  
  /* Video grid */
  .videos {
    max-height: 580px;
    overflow-y: auto;
    padding: 10px;
  }
  .videos::-webkit-scrollbar { width: 8px; }
  .videos::-webkit-scrollbar-track { background: transparent; }
  .videos::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .videos::-webkit-scrollbar-thumb:hover { background: var(--border-hi); }
  
  .video {
    display: grid;
    grid-template-columns: 100px 1fr auto;
    gap: 14px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    background: var(--surface);
    transition: border-color 0.15s;
    align-items: start;
  }
  .video.done { border-color: rgba(0, 229, 133, 0.25); }
  .video.error { border-color: rgba(255, 85, 85, 0.25); }
  .video.fetching { border-color: rgba(255, 179, 71, 0.3); }
  
  .thumb {
    width: 100px;
    height: 60px;
    border-radius: 5px;
    object-fit: cover;
    background: var(--bg);
  }
  .video-info { min-width: 0; }
  .video-title {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    line-height: 1.4;
  }
  .video-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: var(--text-faint);
    flex-wrap: wrap;
  }
  .video-meta a { color: var(--text-dim); text-decoration: none; }
  .video-meta a:hover { color: var(--accent); }
  
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .badge.idle { background: rgba(138, 138, 146, 0.15); color: var(--text-dim); }
  .badge.fetching { background: rgba(255, 179, 71, 0.15); color: var(--warn); }
  .badge.done { background: rgba(0, 229, 133, 0.15); color: var(--accent); }
  .badge.error { background: rgba(255, 85, 85, 0.15); color: var(--danger); }
  .badge .pulse { 
    width: 5px; height: 5px; border-radius: 50%; background: currentColor;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  
  .preview {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    line-height: 1.55;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .err-text {
    font-size: 11px;
    color: var(--danger);
    margin-top: 6px;
    opacity: 0.85;
  }
  
  .video-actions {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: flex-end;
  }
  
  /* Empty state */
  .empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-faint);
    font-size: 12px;
  }
  
  /* Hidden */
  [hidden] { display: none !important; }
  
  /* Responsive */
  @media (max-width: 640px) {
    .container { padding: 14px; }
    .video { grid-template-columns: 80px 1fr; }
    .video-actions { grid-column: 1 / -1; flex-direction: row; align-items: center; }
    .thumb { width: 80px; height: 48px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">
      <div class="logo-mark">YT</div>
      <span>TRANSCRIPT_EXTRACTOR</span>
    </div>
    <span class="version">v1.0 · CLIENT_SIDE</span>
  </header>

  <!-- INPUT PANEL -->
  <section id="input-panel" class="panel" style="margin-bottom:20px">
    <div class="panel-head">
      <span class="panel-label">◆ INPUT</span>
      <span id="extract-status" class="stat"></span>
    </div>
    <div class="panel-body">
      <div style="display:flex;gap:0;margin-bottom:16px;border:1px solid var(--border);border-radius:6px;overflow:hidden;width:fit-content">
        <button id="tab-channel" onclick="switchTab('channel')"
          style="padding:7px 16px;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;border:none;background:var(--text);color:var(--bg)">
          CHANNEL URL
        </button>
        <button id="tab-urls" onclick="switchTab('urls')"
          style="padding:7px 16px;font-family:inherit;font-size:11px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text-dim)">
          PASTE URLs
        </button>
      </div>
      <div id="panel-channel">
        <input id="channel-input" type="text"
          placeholder="https://www.youtube.com/@YourChannel"
          style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 14px;color:var(--text);font-family:inherit;font-size:13px;outline:none"
          onkeydown="if(event.key==='Enter') handleChannelFetch()">
        <div class="hint" style="margin-top:10px">Paste any YouTube channel URL — <strong>@handle</strong>, <strong>/channel/UC...</strong> or <strong>/c/name</strong> all work. Fetches latest 15 videos via RSS.</div>
        <div style="margin-top:14px">
          <button class="btn primary" onclick="handleChannelFetch()" id="channel-fetch-btn">▶ LOAD CHANNEL</button>
        </div>
      </div>
      <div id="panel-urls" style="display:none">
        <textarea id="html-input" placeholder="Paste YouTube URLs one per line:&#10;&#10;https://www.youtube.com/watch?v=dQw4w9WgXcQ&#10;https://youtu.be/jNQXAC9IVRw"></textarea>
        <div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="btn primary" onclick="handleExtract()">⎋ EXTRACT VIDEOS</button>
          <button class="btn ghost" onclick="loadExample()">Load example</button>
        </div>
      </div>
    </div>
  </section>

    <!-- RESULTS PANEL -->
  <section id="results-panel" class="panel" hidden>
    <div class="panel-head">
      <div style="display:flex; align-items:center; gap:12px">
        <button class="btn sm ghost" onclick="goBack()">← BACK</button>
        <span class="panel-label">◆ EXTRACTION_RESULTS</span>
      </div>
      <div class="stats">
        <span class="stat"><span class="dot" style="color:var(--text-dim)"></span><span class="val" id="total-val">0</span> total</span>
        <span class="stat ok" id="done-stat" hidden><span class="dot"></span><span class="val" id="done-val">0</span> done</span>
        <span class="stat err" id="err-stat" hidden><span class="dot"></span><span class="val" id="err-val">0</span> failed</span>
      </div>
    </div>
    <div class="progress"><div class="progress-fill" id="prog-fill"></div></div>
    <div class="panel-head" style="border-top:none; border-bottom:1px solid var(--border)">
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn primary" id="fetch-btn" onclick="fetchAll()">▶ FETCH ALL TRANSCRIPTS</button>
        <button class="btn" id="retry-btn" onclick="retryFailed()" hidden>↻ RETRY FAILED</button>
        <button class="btn" id="zip-btn" onclick="downloadZip()" hidden>⤓ DOWNLOAD ZIP</button>
        <button class="btn ghost" id="copy-all-btn" onclick="copyAll()" hidden>⎘ COPY ALL</button>
      </div>
    </div>
    <div class="videos" id="videos"></div>
  </section>
</div>

<script>

/* -------- Main logic --------
 * Uses the same approach as youtubetotranscript.com:
 *   1. Fetch /watch?v=ID through CORS proxy
 *   2. Extract ytInitialPlayerResponse JSON
 *   3. Parse captions.playerCaptionsTracklistRenderer.captionTracks
 *   4. Fetch the signed baseUrl for the chosen track
 *   5. Parse the resulting timed-text XML
 */

// CORS proxy fallback chain — tries each in order

let videos = []; // { id, title, status, text, error, lang, kind }

/* -------- Video ID extraction -------- */

function extractVideoIds(input) {
  const ids = new Set();
  const patterns = [
    // URL patterns (absolute and relative)
    /(?:youtube\.com\/(?:watch\?(?:[^"'&\s]*&)*v=|embed\/|shorts\/|v\/|live\/)|youtu\.be\/|(?:^|[^a-zA-Z0-9])\/watch\?v=)([a-zA-Z0-9_-]{11})/g,
    // JSON videoId field (YouTube's ytInitialData uses this everywhere)
    /"videoId"\s*:\s*"([a-zA-Z0-9_-]{11})"/g,
    // data-video-id attribute
    /data-video-id=["']([a-zA-Z0-9_-]{11})["']/g,
    // Raw 11-char IDs on their own line (for URL list input)
    /^([a-zA-Z0-9_-]{11})$/gm,
  ];
  for (const re of patterns) {
    let m;
    while ((m = re.exec(input)) !== null) ids.add(m[1]);
  }
  return [...ids];
}

/* -------- Fetching with proxy fallback -------- */

function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(`Timeout after ${ms}ms (${label || 'request'})`)), ms))
  ]);
}

async function proxyFetch(url, timeoutMs = 20000) {
  try {
    const res = await withTimeout(fetch(PROXIES[0](url)), timeoutMs, 'local server');
    if (!res.ok) throw new Error(`Local server HTTP ${res.status}`);
    const text = await withTimeout(res.text(), 15000, 'local server body');
    if (!text || !text.trim()) throw new Error('Empty response from YouTube — it may be blocking the request');
    return text;
  } catch (e) {
    throw e;
  }
}

/* -------- JSON extraction from HTML -------- */

function extractPlayerResponse(html) {
  // YouTube uses different prefixes depending on the page variant
  const markers = [
    'var ytInitialPlayerResponse = ',
    'ytInitialPlayerResponse = ',
    'window["ytInitialPlayerResponse"] = ',
    "window['ytInitialPlayerResponse'] = ",
  ];
  
  let idx = -1, markerLen = 0;
  for (const m of markers) {
    const i = html.indexOf(m);
    if (i !== -1) { idx = i; markerLen = m.length; break; }
  }
  if (idx === -1) return null;
  
  const start = idx + markerLen;
  // Walk JSON structure tracking braces, being careful about strings and escapes
  let depth = 0, inStr = false, esc = false, end = -1;
  for (let i = start; i < html.length; i++) {
    const c = html[i];
    if (esc) { esc = false; continue; }
    if (c === '\\') { esc = true; continue; }
    if (c === '"') { inStr = !inStr; continue; }
    if (inStr) continue;
    if (c === '{') depth++;
    else if (c === '}') {
      depth--;
      if (depth === 0) { end = i + 1; break; }
    }
  }
  if (end === -1) return null;
  try {
    return JSON.parse(html.substring(start, end));
  } catch (e) {
    return null;
  }
}

/* -------- Transcript fetch pipeline -------- */

async function fetchTranscript(videoId) {
  const res = await fetch(`/api/transcript?v=${videoId}`);
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
  return { title: data.title || videoId, text: data.text, lang: data.lang, kind: data.kind };
}

function switchTab(tab) {
  document.getElementById('panel-channel').style.display = tab === 'channel' ? '' : 'none';
  document.getElementById('panel-urls').style.display = tab === 'urls' ? '' : 'none';
  const ch = document.getElementById('tab-channel');
  const ur = document.getElementById('tab-urls');
  ch.style.background = tab === 'channel' ? 'var(--text)' : 'transparent';
  ch.style.color = tab === 'channel' ? 'var(--bg)' : 'var(--text-dim)';
  ch.style.fontWeight = tab === 'channel' ? '600' : '500';
  ur.style.background = tab === 'urls' ? 'var(--text)' : 'transparent';
  ur.style.color = tab === 'urls' ? 'var(--bg)' : 'var(--text-dim)';
  ur.style.fontWeight = tab === 'urls' ? '600' : '500';
}

async function handleChannelFetch() {
  const url = document.getElementById('channel-input').value.trim();
  const statusEl = document.getElementById('extract-status');
  const btn = document.getElementById('channel-fetch-btn');
  if (!url) { statusEl.innerHTML = '<span style="color:var(--danger)">⚠ Paste a channel URL first</span>'; return; }
  btn.disabled = true; btn.textContent = '▵ Loading…';
  statusEl.innerHTML = '<span style="color:var(--warn)">fetching RSS…</span>';
  try {
    const res = await fetch(`/api/channel?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Failed');
    statusEl.innerHTML = `<span style="color:var(--accent)">✓ ${esc(data.channelName)} · ${data.videos.length} videos</span>`;
    videos = data.videos.map(v => ({ id: v.id, title: v.title, status: 'idle', text: null, error: null, lang: null, kind: null }));
    document.getElementById('total-val').textContent = videos.length;
    document.getElementById('input-panel').hidden = true;
    document.getElementById('results-panel').hidden = false;
    renderVideos();
  } catch(err) {
    statusEl.innerHTML = `<span style="color:var(--danger)">✗ ${esc(err.message)}</span>`;
  } finally {
    btn.disabled = false; btn.textContent = '▶ LOAD CHANNEL';
  }
}

function handleExtract() {
  const input = document.getElementById('html-input').value;
  const ids = extractVideoIds(input);
  const statusEl = document.getElementById('extract-status');
  
  if (ids.length === 0) {
    statusEl.innerHTML = '<span style="color:var(--danger)">⚠ No YouTube videos found</span>';
    return;
  }
  
  statusEl.innerHTML = `<span style="color:var(--accent)">✓ Found ${ids.length}</span>`;
  
  videos = ids.map(id => ({
    id, title: id, status: 'idle', text: null, error: null, lang: null, kind: null
  }));
  
  document.getElementById('total-val').textContent = ids.length;
  document.getElementById('input-panel').hidden = true;
  document.getElementById('results-panel').hidden = false;
  renderVideos();
}

function goBack() {
  document.getElementById('results-panel').hidden = true;
  document.getElementById('input-panel').hidden = false;
  videos = [];
  document.getElementById('extract-status').innerHTML = '';
}

function loadExample() {
  document.getElementById('html-input').value = 
`https://www.youtube.com/watch?v=dQw4w9WgXcQ
https://www.youtube.com/watch?v=jNQXAC9IVRw
https://www.youtube.com/watch?v=9bZkp7q19f0`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function statusBadge(s) {
  if (s === 'idle') return '<span class="badge idle">idle</span>';
  if (s === 'fetching') return '<span class="badge fetching"><span class="pulse"></span>fetching</span>';
  if (s === 'done') return '<span class="badge done">✓ done</span>';
  if (s === 'error') return '<span class="badge error">✗ failed</span>';
  return '';
}

function renderVideos() {
  const host = document.getElementById('videos');
  if (videos.length === 0) {
    host.innerHTML = '<div class="empty">No videos</div>';
    return;
  }
  host.innerHTML = videos.map((v, i) => `
    <div class="video ${v.status}" id="vid-${v.id}">
      <img class="thumb" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" loading="lazy" alt="">
      <div class="video-info">
        <div class="video-title">${esc(v.title)}</div>
        <div class="video-meta">
          <a href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">${v.id} ↗</a>
          ${statusBadge(v.status)}
          ${v.lang ? `<span>· ${esc(v.lang)}${v.kind === 'asr' ? ' (auto)' : ''}</span>` : ''}
        </div>
        ${v.text ? `<div class="preview">${esc(v.text.substring(0, 250))}…</div>` : ''}
        ${v.error ? `<div class="err-text">${esc(v.error)}</div>` : ''}
      </div>
      <div class="video-actions">
        ${v.status === 'done' ? `
          <button class="btn sm" onclick="downloadOne(${i})">⤓ TXT</button>
          <button class="btn sm ghost" onclick="copyOne(${i})" id="cp-${v.id}">⎘ Copy</button>
        ` : v.status === 'error' ? `
          <button class="btn sm ghost" onclick="retryOne(${i})">↻ Retry</button>
        ` : ''}
      </div>
    </div>
  `).join('');
  updateStats();
}

function updateVideoCard(i) {
  const v = videos[i];
  const el = document.getElementById(`vid-${v.id}`);
  if (!el) return;
  el.className = `video ${v.status}`;
  el.innerHTML = `
    <img class="thumb" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" loading="lazy" alt="">
    <div class="video-info">
      <div class="video-title">${esc(v.title)}</div>
      <div class="video-meta">
        <a href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">${v.id} ↗</a>
        ${statusBadge(v.status)}
        ${v.lang ? `<span>· ${esc(v.lang)}${v.kind === 'asr' ? ' (auto)' : ''}</span>` : ''}
      </div>
      ${v.text ? `<div class="preview">${esc(v.text.substring(0, 250))}…</div>` : ''}
      ${v.error ? `<div class="err-text">${esc(v.error)}</div>` : ''}
    </div>
    <div class="video-actions">
      ${v.status === 'done' ? `
        <button class="btn sm" onclick="downloadOne(${i})">⤓ TXT</button>
        <button class="btn sm ghost" onclick="copyOne(${i})" id="cp-${v.id}">⎘ Copy</button>
      ` : v.status === 'error' ? `
        <button class="btn sm ghost" onclick="retryOne(${i})">↻ Retry</button>
      ` : ''}
    </div>
  `;
}

function updateStats() {
  const done = videos.filter(v => v.status === 'done').length;
  const err = videos.filter(v => v.status === 'error').length;
  const complete = done + err;
  const total = videos.length;
  
  document.getElementById('done-val').textContent = done;
  document.getElementById('err-val').textContent = err;
  document.getElementById('done-stat').hidden = done === 0;
  document.getElementById('err-stat').hidden = err === 0;
  document.getElementById('zip-btn').hidden = done === 0;
  document.getElementById('copy-all-btn').hidden = done === 0;
  document.getElementById('retry-btn').hidden = err === 0;
  document.getElementById('prog-fill').style.width = total > 0 ? `${(complete / total) * 100}%` : '0%';
}

/* -------- Batch fetching with concurrency -------- */

async function runBatch(indices) {
  const CONCURRENCY = 4;
  let cursor = 0;
  
  async function worker() {
    while (true) {
      const pos = cursor++;
      if (pos >= indices.length) break;
      const i = indices[pos];
      videos[i].status = 'fetching';
      videos[i].error = null;
      updateVideoCard(i);
      updateStats();
      try {
        const result = await fetchTranscript(videos[i].id);
        videos[i] = { ...videos[i], title: result.title, text: result.text, lang: result.lang, kind: result.kind, status: 'done', error: null };
      } catch (e) {
        videos[i].status = 'error';
        videos[i].error = e.message || 'Unknown error';
      }
      updateVideoCard(i);
      updateStats();
    }
  }
  
  const workers = Array(Math.min(CONCURRENCY, indices.length)).fill(0).map(worker);
  await Promise.all(workers);
}

async function fetchAll() {
  const btn = document.getElementById('fetch-btn');
  btn.disabled = true;
  btn.textContent = '⏵ FETCHING...';
  const indices = videos.map((_, i) => i);
  await runBatch(indices);
  btn.disabled = false;
  btn.textContent = '↻ REFETCH ALL';
}

async function retryFailed() {
  const indices = videos.map((v, i) => v.status === 'error' ? i : -1).filter(i => i >= 0);
  if (indices.length === 0) return;
  document.getElementById('retry-btn').disabled = true;
  await runBatch(indices);
  document.getElementById('retry-btn').disabled = false;
}

async function retryOne(i) {
  await runBatch([i]);
}

/* -------- Downloads -------- */

function safeFilename(v) {
  const clean = (v.title || v.id).replace(/[^a-zA-Z0-9 \-_\.]/g, '').substring(0, 80).trim();
  return `${clean || v.id}_${v.id}.txt`;
}

function downloadOne(i) {
  const v = videos[i];
  if (!v.text) return;
  const content = `${v.title}\nhttps://youtube.com/watch?v=${v.id}\nLanguage: ${v.lang}${v.kind === 'asr' ? ' (auto-generated)' : ''}\n\n${v.text}`;
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = safeFilename(v);
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function copyOne(i) {
  const v = videos[i];
  if (!v.text) return;
  try {
    await navigator.clipboard.writeText(v.text);
    const btn = document.getElementById(`cp-${v.id}`);
    if (btn) {
      const orig = btn.innerHTML;
      btn.innerHTML = '✓ Copied';
      setTimeout(() => { btn.innerHTML = orig; }, 1500);
    }
  } catch(e) { alert('Copy failed: ' + e.message); }
}

async function downloadZip() {
  const done = videos.filter(v => v.status === 'done');
  if (done.length === 0) return;
  const zip = new JSZip();
  for (const v of done) {
    const content = `${v.title}\nhttps://youtube.com/watch?v=${v.id}\nLanguage: ${v.lang}${v.kind === 'asr' ? ' (auto-generated)' : ''}\n\n${v.text}`;
    zip.file(safeFilename(v), content);
  }
  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `youtube_transcripts_${new Date().toISOString().slice(0,10)}.zip`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function copyAll() {
  const done = videos.filter(v => v.status === 'done');
  const combined = done.map(v => 
    `=== ${v.title} ===\nhttps://youtube.com/watch?v=${v.id}\n\n${v.text}\n\n`
  ).join('');
  try {
    await navigator.clipboard.writeText(combined);
    const btn = document.getElementById('copy-all-btn');
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ COPIED';
    setTimeout(() => { btn.innerHTML = orig; }, 1500);
  } catch(e) { alert('Copy failed: ' + e.message); }
}
</script>
