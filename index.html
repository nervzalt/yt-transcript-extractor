<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Transcript Extractor</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0b;--surface:#131316;--surface-hi:#1c1c21;
  --border:#26262b;--border-hi:#3a3a42;
  --text:#e8e8ea;--text-dim:#8a8a92;--text-faint:#5a5a62;
  --accent:#00e585;--accent-dim:#00b36a;
  --danger:#ff5555;--warn:#ffb347;
}
body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;font-size:20px;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:24px}

header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;letter-spacing:.02em}
.logo-mark{width:22px;height:22px;background:var(--accent);color:#000;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}

.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.card-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-label{font-size:16px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;font-weight:500}
.card-body{padding:20px}

.btn{display:inline-flex;align-items:center;gap:5px;padding:9px 17px;border:1px solid var(--border-hi);border-radius:6px;background:transparent;color:var(--text);font-family:inherit;font-size:17px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--surface-hi);border-color:var(--text-dim)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}
.btn.primary:hover{background:var(--accent-dim);border-color:var(--accent-dim)}
.btn.sm{padding:6px 13px;font-size:16px}
.btn.ghost{border-color:transparent;color:var(--text-dim)}
.btn.ghost:hover{color:var(--text);border-color:var(--border)}
.btn.active{background:var(--surface-hi);border-color:var(--accent);color:var(--accent)}

input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px 16px;color:var(--text);font-family:inherit;font-size:17px;outline:none;transition:border-color .15s}
input[type=text]:focus,textarea:focus{border-color:var(--accent-dim)}
textarea{min-height:110px;resize:vertical}

.tabs{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;width:fit-content;margin-bottom:14px}
.tab{padding:8px 18px;font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text-dim);transition:all .15s}
.tab.active{background:var(--text);color:var(--bg);font-weight:700}

.prog{height:2px;background:var(--bg)}
.prog-fill{height:100%;background:var(--accent);width:0%;transition:width .4s}

.badge{padding:2px 7px;border-radius:99px;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.badge.idle{background:rgba(138,138,146,.15);color:var(--text-faint)}
.badge.fetching{background:rgba(255,179,71,.15);color:var(--warn)}
.badge.done{background:rgba(0,229,133,.15);color:var(--accent)}
.badge.error{background:rgba(255,85,85,.15);color:var(--danger)}

/* ── Shared slider track/handle style ── */
/* Both sliders: 6px track, 20px handles */

/* Video range — custom proportional drag slider */
#vid-slider{position:relative;height:26px;margin:8px 0;user-select:none}
#vid-track-bg{position:absolute;left:10px;right:10px;top:50%;transform:translateY(-50%);height:6px;background:var(--border-hi);border-radius:3px}
#vid-track-fill{position:absolute;inset:0;pointer-events:none}
#vid-ticks{position:absolute;inset:0;pointer-events:none}
#vid-ticks span{position:absolute;top:50%;transform:translate(-50%,-50%);width:2px;height:14px;background:var(--surface);border-radius:1px}
.vid-handle{position:absolute;top:50%;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);cursor:grab;z-index:2;box-shadow:0 0 0 1px var(--accent-dim)}
.vid-handle:hover{box-shadow:0 0 0 3px rgba(0,229,133,.25)}
.vid-handle.dragging{cursor:grabbing;box-shadow:0 0 0 4px rgba(0,229,133,.3)}

/* Duration — native dual-range slider, same proportions */
.dual-slider{position:relative;height:26px;display:flex;align-items:center}
.dual-slider-bg{position:absolute;left:0;right:0;height:6px;background:var(--border-hi);border-radius:3px}
.dual-slider-fill{position:absolute;height:6px;background:var(--accent);border-radius:3px;pointer-events:none}
.dual-slider input[type=range]{position:absolute;width:100%;height:6px;background:transparent;-webkit-appearance:none;appearance:none;pointer-events:none;outline:none}
.dual-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);cursor:pointer;pointer-events:all;box-shadow:0 0 0 1px var(--accent-dim)}
.dual-slider input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);cursor:pointer;pointer-events:all;box-shadow:0 0 0 1px var(--accent-dim)}

.stats-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:16px;color:var(--text-dim)}
.stats-row .val{color:var(--text);font-weight:600}
.stats-row .val.green{color:var(--accent)}
.stats-row .val.red{color:var(--danger)}

.vlist{display:flex;flex-direction:column;gap:12px;padding:10px}
.vlist:empty::after{content:'No videos';display:block;padding:40px;text-align:center;color:var(--text-faint);font-size:17px}

.vcard{display:grid;grid-template-columns:20px 104px 1fr auto;gap:12px;align-items:center;padding:14px 18px;border:1px solid var(--border);border-radius:8px;background:var(--surface);transition:border-color .15s,background .15s,opacity .15s;cursor:pointer}
.vcard:hover{background:var(--surface-hi)}
.vcard.selected{border-color:rgba(0,229,133,.3);background:rgba(0,229,133,.03)}
.vcard.excluded{opacity:.32;filter:grayscale(.5)}
.vcard.excluded:hover{opacity:.5}
.vcard.done{border-color:rgba(0,229,133,.18)}
.vcard.error{border-color:rgba(255,85,85,.18)}
.vcard.fetching{border-color:rgba(255,179,71,.22)}
.vcard input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.thumb-wrap{position:relative;width:104px;height:62px;flex-shrink:0;cursor:pointer}
.thumb{width:104px;height:62px;border-radius:4px;object-fit:cover;background:var(--bg);display:block}
.thumb-dur{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.82);color:#fff;font-size:13px;font-weight:600;padding:1px 5px;border-radius:3px;letter-spacing:.02em;pointer-events:none;line-height:1.5}
.vinfo{min-width:0}
.vtitle{font-size:17px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px}
.vmeta{display:flex;align-items:center;gap:7px;font-size:16px;color:var(--text-faint)}
.vpreview{font-size:16px;color:var(--text-dim);margin-top:4px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.verr{font-size:16px;color:var(--danger);margin-top:3px}
.vactions{display:flex;gap:6px;align-items:center;flex-shrink:0}

.action-bar{display:flex;gap:7px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--border);align-items:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo"><div class="logo-mark">YT</div> TRANSCRIPT EXTRACTOR</div>
</header>

<section id="input-panel" class="card">
  <div class="card-head">
    <span class="card-label">Input</span>
    <span id="extract-status" style="font-size:16px;color:var(--text-faint)"></span>
  </div>
  <div class="card-body">
    <div class="tabs">
      <button class="tab active" id="tab-ch" onclick="switchTab('ch')">Channel URL</button>
      <button class="tab"        id="tab-ur" onclick="switchTab('ur')">Paste URLs</button>
    </div>
    <div id="panel-ch">
      <input id="channel-input" type="text" placeholder="https://www.youtube.com/@YourChannel"
        onkeydown="if(event.key==='Enter')handleChannelFetch('long')">
      <p style="font-size:16px;color:var(--text-faint);margin-top:8px">Supports @handle · /channel/UC... · /c/name</p>
      <div style="margin-top:12px;display:flex;gap:10px">
        <button class="btn primary" onclick="handleChannelFetch('long')"  id="ch-btn-long">▶ Load Longform</button>
        <button class="btn"         onclick="handleChannelFetch('short')" id="ch-btn-short">⚡ Load Shortform</button>
      </div>
    </div>
    <div id="panel-ur" style="display:none">
      <textarea id="url-input" placeholder="One YouTube URL per line&#10;&#10;https://youtube.com/watch?v=dQw4w9WgXcQ"></textarea>
      <div style="margin-top:10px;display:flex;gap:12px">
        <button class="btn primary" onclick="handleUrlExtract()">Extract Videos</button>
        <button class="btn ghost" onclick="document.getElementById('url-input').value='https://www.youtube.com/watch?v=dQw4w9WgXcQ\nhttps://www.youtube.com/watch?v=jNQXAC9IVRw'">Example</button>
      </div>
    </div>
  </div>
</section>

<div id="results-panel" hidden>
  <div class="card">
    <div class="card-head">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn sm ghost" onclick="goBack()">← Back</button>
        <span class="card-label" id="ch-label">Results</span>
      </div>
      <div class="stats-row">
        <span id="done-stat" hidden><span class="val green" id="done-val">0</span> done</span>
        <span id="err-stat"  hidden><span class="val red"   id="err-val">0</span> failed</span>
      </div>
    </div>
    <div class="prog"><div class="prog-fill" id="prog-fill"></div></div>
    <div class="card-body" style="display:flex;flex-direction:column;gap:20px">

      <!-- Video range -->
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:16px">
            <span style="color:var(--text-faint)">Selected </span><span id="sel-duration" style="color:var(--text);font-weight:600"></span>
            <span style="color:var(--text-faint)"> from </span>
            <span id="ch-total" style="color:var(--text-faint);font-weight:500">0</span>
            <span style="color:var(--text-faint)"> total</span>
          </span>
          <span style="font-size:16px;color:var(--text-dim)">
            <span id="vid-start-label" style="color:var(--accent);font-weight:700">#1</span>
            <span style="color:var(--text-faint)"> → </span>
            <span id="vid-end-label" style="color:var(--accent);font-weight:700">#10</span>
          </span>
        </div>
        <div id="vid-slider">
          <div id="vid-track-bg"></div>
          <div id="vid-track-fill"></div>
          <div id="vid-ticks"></div>
          <div id="vid-handle-start" class="vid-handle"></div>
          <div id="vid-handle-end"   class="vid-handle"></div>
        </div>
      </div>

      <!-- Duration + Views filters side by side -->
      <div style="display:flex;gap:36px">

        <!-- Duration filter -->
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-size:16px;color:var(--text-dim)">Duration</span>
            <span style="font-size:16px;color:var(--text-dim)">
              <span id="dur-min-label" style="color:var(--accent);font-weight:700">Any</span>
              <span style="color:var(--text-faint)"> → </span>
              <span id="dur-max-label" style="color:var(--accent);font-weight:700">Any</span>
            </span>
          </div>
          <div class="dual-slider">
            <div class="dual-slider-bg"></div>
            <div class="dual-slider-fill" id="dur-fill"></div>
            <input type="range" id="dur-min" min="0" max="180" value="0"   step="1" oninput="onDurRange(this,'min')">
            <input type="range" id="dur-max" min="0" max="180" value="180" step="1" oninput="onDurRange(this,'max')">
          </div>
          <div style="display:flex;justify-content:space-between;font-size:15px;color:var(--text-faint)">
            <span>0 min</span><span class="dur-max-tick">180 min</span>
          </div>
        </div>

        <!-- Views filter -->
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-size:16px;color:var(--text-dim)">Views</span>
            <span style="font-size:16px;color:var(--text-dim)">
              <span id="view-min-label" style="color:var(--accent);font-weight:700">Any</span>
              <span style="color:var(--text-faint)"> → </span>
              <span id="view-max-label" style="color:var(--accent);font-weight:700">Any</span>
            </span>
          </div>
          <div class="dual-slider">
            <div class="dual-slider-bg"></div>
            <div class="dual-slider-fill" id="view-fill"></div>
            <input type="range" id="view-min" min="0" max="100" value="0"   step="10" oninput="onViewRange(this,'min')">
            <input type="range" id="view-max" min="0" max="100" value="100" step="10" oninput="onViewRange(this,'max')">
          </div>
          <div style="display:flex;justify-content:space-between;font-size:15px;color:var(--text-faint)">
            <span>Most viewed</span><span>Least viewed</span>
          </div>
        </div>

      </div>

    </div>
    <div class="action-bar">
      <button class="btn primary" id="fetch-btn" onclick="fetchSelected()">▶ Fetch Selected</button>
      <button class="btn" id="retry-btn" onclick="retryFailed()" hidden>↻ Retry Failed</button>
      <div style="margin-left:auto;display:flex;gap:7px;align-items:center">
        <button class="btn sm ghost" id="sort-btn" onclick="toggleSort()" title="Sort by duration">⏱ Longest first</button>
        <button class="btn sm ghost" id="streams-btn" onclick="toggleStreams()" title="Show streams only">📡 Streams only</button>
        <button class="btn" id="dl-txt-btn" onclick="downloadTxt()" hidden>⤓ Download TXT</button>
        <button class="btn" id="dl-zip-btn" onclick="downloadZip()" hidden>⤓ ZIP</button>
        <button class="btn ghost" id="copy-btn" onclick="copyAll()" hidden>⎘ Copy All</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="vlist" id="vlist"></div>
  </div>
</div>
</div>

<script>
let allVideos = [], videos = [], selected = new Set(), filteredIds = new Set(), channelName = '';
let manualOn = new Set(), manualOff = new Set(); // manual overrides on top of filter
let durMin = 0, durMax = 180;
let viewFromTop = 0, viewToTop = 100;
let vidStart = 0, vidEnd = 10;
let sortLongest = false, streamsOnly = false;

// ── Tabs ──────────────────────────────────────────────────────────────────────
function switchTab(t) {
  document.getElementById('panel-ch').style.display = t==='ch'?'':'none';
  document.getElementById('panel-ur').style.display = t==='ur'?'':'none';
  document.getElementById('tab-ch').className='tab'+(t==='ch'?' active':'');
  document.getElementById('tab-ur').className='tab'+(t==='ur'?' active':'');
}

// ── Channel load ──────────────────────────────────────────────────────────────
async function handleChannelFetch(type='long') {
  const url = document.getElementById('channel-input').value.trim();
  const statusEl = document.getElementById('extract-status');
  const btnL = document.getElementById('ch-btn-long');
  const btnS = document.getElementById('ch-btn-short');
  if (!url) { statusEl.textContent='Paste a channel URL first'; return; }
  btnL.disabled=true; btnS.disabled=true;
  (type==='short'?btnS:btnL).textContent='Loading…';
  statusEl.textContent='Fetching…';
  try {
    const res = await fetch(`/api/channel?url=${encodeURIComponent(url)}&type=${type}`);
    const data = await res.json();
    if (!res.ok||data.error) throw new Error(data.error||'Failed');
    channelName = data.channelName || 'Channel';
    allVideos = data.videos.map(v=>({id:v.id,title:v.title,duration:v.duration??null,views:v.views||null,viewCount:parseViewCount(v.views),isStream:/streamed/i.test(v.views||''),status:'idle',text:null,error:null,lang:null,kind:null}));
    manualOn.clear(); manualOff.clear();
    document.getElementById('ch-total').textContent = allVideos.length;
    document.getElementById('ch-label').textContent = channelName.toUpperCase() + (type==='short'?' · SHORTS':'');
    initDurSlider();
    initViewsSlider();
    initVidSlider();
    selectLatestHours(10);
    document.getElementById('input-panel').hidden = true;
    document.getElementById('results-panel').hidden = false;
    statusEl.textContent = '';
  } catch(e) {
    statusEl.textContent = '✗ '+e.message;
  } finally {
    btnL.disabled=false; btnS.disabled=false;
    btnL.textContent='▶ Load Longform'; btnS.textContent='⚡ Load Shortform';
  }
}

// ── URL paste ─────────────────────────────────────────────────────────────────
function handleUrlExtract() {
  const ids = extractIds(document.getElementById('url-input').value);
  if (!ids.length) { document.getElementById('extract-status').textContent='No URLs found'; return; }
  channelName='Videos';
  allVideos = ids.map(id=>({id,title:id,duration:null,status:'idle',text:null,error:null,lang:null,kind:null}));
  document.getElementById('ch-total').textContent = allVideos.length;
  document.getElementById('ch-label').textContent = 'VIDEOS';
  initDurSlider();
  initViewsSlider();
  initVidSlider();
  selectLatestHours(10);
  document.getElementById('input-panel').hidden=true;
  document.getElementById('results-panel').hidden=false;
}

function extractIds(input) {
  const ids=new Set();
  const patterns=[
    /(?:youtube\.com\/(?:watch\?(?:[^"'&\s]*&)*v=|embed\/|shorts\/|v\/|live\/)|youtu\.be\/|(?:^|[^a-zA-Z0-9])\/watch\?v=)([a-zA-Z0-9_-]{11})/g,
    /"videoId"\s*:\s*"([a-zA-Z0-9_-]{11})"/g,
    /^([a-zA-Z0-9_-]{11})$/gm,
  ];
  for(const re of patterns){let m;while((m=re.exec(input))!==null)ids.add(m[1]);}
  return[...ids];
}

function goBack() {
  document.getElementById('results-panel').hidden=true;
  document.getElementById('input-panel').hidden=false;
  allVideos=[];videos=[];selected=new Set();channelName='';
  document.getElementById('vid-ticks').innerHTML='';
  document.getElementById('sel-duration').textContent='';
}

// ── Video range — proportional drag slider ────────────────────────────────────
// Positions array: positions[i] = fraction (0–1) where video i starts.
// positions[N] = 1.0. Length = allVideos.length + 1.
function getVidPositions() {
  if (!allVideos.length) return [0, 1];
  const total = allVideos.reduce((a,v) => a + (v.duration||60), 0);
  let acc = 0;
  const pos = [0];
  for (const v of allVideos) { acc += (v.duration||60); pos.push(acc/total); }
  return pos;
}

function snapToNearest(frac, positions) {
  let best=0, bestD=Infinity;
  positions.forEach((p,i) => { const d=Math.abs(p-frac); if(d<bestD){bestD=d;best=i;} });
  return best;
}

// Convert a 0–1 fraction to a CSS left value that matches native range thumb travel.
// Native range: thumb center goes from 10px (left) to width-10px (right).
function pct(frac) {
  return `calc(10px + (100% - 20px) * ${frac.toFixed(5)})`;
}

function updateVidHandles() {
  if (!allVideos.length) return;
  const pos = getVidPositions();
  document.getElementById('vid-handle-start').style.left = pct(pos[vidStart]);
  document.getElementById('vid-handle-end').style.left   = pct(pos[vidEnd]);
  document.getElementById('vid-start-label').textContent = '#' + (vidStart+1);
  document.getElementById('vid-end-label').textContent   = '#' + vidEnd;

  // Segmented fill — use filteredIds which already accounts for ALL active filters
  const fill = document.getElementById('vid-track-fill');
  let html = '';
  for (let i = vidStart; i < vidEnd; i++) {
    const v = allVideos[i];
    const passes = selected.has(v.id);
    const segL = pos[i], segR = pos[i+1];
    html += `<div style="position:absolute;top:50%;transform:translateY(-50%);height:6px;` +
      `left:${pct(segL)};width:calc((100% - 20px) * ${(segR-segL).toFixed(5)});` +
      `background:${passes?'var(--accent)':'var(--border-hi)'};border-radius:1px;pointer-events:none"></div>`;
  }
  fill.innerHTML = html;
  // Clear any inline left/width from old single-div approach
  fill.style.left = '';
  fill.style.width = '';
}

function renderVidTicks() {
  const ticks = document.getElementById('vid-ticks');
  if (!allVideos.length) { ticks.innerHTML=''; return; }
  const pos = getVidPositions();
  // Draw inner boundaries (skip first=0 and last=1 since those are the track edges)
  ticks.innerHTML = pos.slice(1,-1).map(p =>
    `<span style="left:${pct(p)}"></span>`
  ).join('');
}

function initVidSlider() {
  vidStart = 0;
  vidEnd = Math.min(10, allVideos.length);
  renderVidTicks();
  updateVidHandles();
}

// Drag — set up once on page load
(function setupVidDrag() {
  let dragging = null;

  function getFrac(clientX) {
    const rect = document.getElementById('vid-slider').getBoundingClientRect();
    return Math.max(0, Math.min(1, (clientX - rect.left - 10) / (rect.width - 20)));
  }

  function onMove(clientX) {
    if (!dragging) return;
    const idx = snapToNearest(getFrac(clientX), getVidPositions());
    if (dragging==='start') vidStart = Math.min(idx, vidEnd-1);
    else                    vidEnd   = Math.max(idx, vidStart+1);
    applyFilters(); // sets filteredIds then calls updateVidHandles
  }

  const hs = document.getElementById('vid-handle-start');
  const he = document.getElementById('vid-handle-end');

  hs.addEventListener('mousedown', e => { dragging='start'; hs.classList.add('dragging'); e.preventDefault(); });
  he.addEventListener('mousedown', e => { dragging='end';   he.classList.add('dragging'); e.preventDefault(); });
  document.addEventListener('mousemove', e => onMove(e.clientX));
  document.addEventListener('mouseup', () => {
    if (dragging) { document.getElementById('vid-handle-'+dragging).classList.remove('dragging'); dragging=null; }
  });
  hs.addEventListener('touchstart', () => { dragging='start'; hs.classList.add('dragging'); }, {passive:true});
  he.addEventListener('touchstart', () => { dragging='end';   he.classList.add('dragging'); }, {passive:true});
  document.addEventListener('touchmove', e => { if(dragging){e.preventDefault();onMove(e.touches[0].clientX);} }, {passive:false});
  document.addEventListener('touchend', () => {
    if (dragging) { document.getElementById('vid-handle-'+dragging).classList.remove('dragging'); dragging=null; }
  });
})();

// ── Duration range slider ─────────────────────────────────────────────────────
function onDurRange(el, which) {
  let mn=parseInt(document.getElementById('dur-min').value);
  let mx=parseInt(document.getElementById('dur-max').value);
  if (mn>mx) { if(which==='min') mn=mx; else mx=mn; }
  durMin=mn; durMax=mx;
  document.getElementById('dur-min').value=mn;
  document.getElementById('dur-max').value=mx;
  const sMax=parseInt(document.getElementById('dur-max').max)||180;
  document.getElementById('dur-min-label').textContent = mn===0    ? 'Any' : mn+' min';
  document.getElementById('dur-max-label').textContent = mx>=sMax  ? 'Any' : mx+' min';
  document.getElementById('dur-fill').style.left  = (mn/sMax*100)+'%';
  document.getElementById('dur-fill').style.width = ((mx-mn)/sMax*100)+'%';
  applyFilters();
}

function initDurSlider() {
  const durations = allVideos.filter(v=>v.duration).map(v=>v.duration/60);
  const maxMins = durations.length ? Math.ceil(Math.max(...durations)/5)*5 : 180;
  durMin=0; durMax=maxMins;
  document.getElementById('dur-min').max=maxMins;
  document.getElementById('dur-max').max=maxMins;
  document.getElementById('dur-min').value=0;
  document.getElementById('dur-max').value=maxMins;
  document.getElementById('dur-min-label').textContent='Any';
  document.getElementById('dur-max-label').textContent='Any';
  document.getElementById('dur-fill').style.left='0%';
  document.getElementById('dur-fill').style.width='100%';
  const tick=document.querySelector('.dur-max-tick');
  if(tick) tick.textContent=maxMins+' min';
}

// ── Views range slider ────────────────────────────────────────────────────────
function parseViewCount(s) {
  if (!s) return null;
  const t = s.replace(/views?/i,'').replace(/,/g,'').trim();
  if (/b$/i.test(t)) return parseFloat(t)*1e9;
  if (/m$/i.test(t)) return parseFloat(t)*1e6;
  if (/k$/i.test(t)) return parseFloat(t)*1e3;
  return parseInt(t)||null;
}

// Sorted descending within the current video range: index 0 = most viewed
function getSortedViewCounts() {
  return allVideos.slice(vidStart, vidEnd).map(v=>v.viewCount).filter(x=>x!==null).sort((a,b)=>b-a);
}

function getViewLabel() {
  const f = viewFromTop, t = viewToTop;
  if (f===0 && t===100) return 'Any';
  if (f===0)   return `Top ${t}% viewed`;
  if (t===100) return `Excl. top ${f}%`;
  return `Between ${f}%–${t}%`;
}

function updateViewFill() {
  document.getElementById('view-fill').style.left  = viewFromTop+'%';
  document.getElementById('view-fill').style.width = (viewToTop-viewFromTop)+'%';
  const label = getViewLabel();
  // Show single label on the right side of the header
  document.getElementById('view-min-label').textContent = '';
  document.getElementById('view-max-label').textContent = label;
}

function onViewRange(el, which) {
  let f=parseInt(document.getElementById('view-min').value);
  let t=parseInt(document.getElementById('view-max').value);
  if (f>t) { if(which==='min') f=t; else t=f; }
  viewFromTop=f; viewToTop=t;
  document.getElementById('view-min').value=f;
  document.getElementById('view-max').value=t;
  updateViewFill();
  applyFilters();
}

function initViewsSlider() {
  viewFromTop=0; viewToTop=100;
  document.getElementById('view-min').value=0;
  document.getElementById('view-max').value=100;
  document.getElementById('view-min-label').textContent='';
  document.getElementById('view-max-label').textContent='Any';
  document.getElementById('view-fill').style.left='0%';
  document.getElementById('view-fill').style.width='100%';
}

// ── Apply filters ─────────────────────────────────────────────────────────────
function applyFilters() {
  const prevMap={};
  videos.forEach(v=>{prevMap[v.id]=v;});
  videos=allVideos.map(v=>prevMap[v.id]||v);
  const sMax=parseInt(document.getElementById('dur-max').max)||180;

  // Views thresholds — sortedDesc[0]=most viewed
  const vDesc = getSortedViewCounts();
  const N = vDesc.length;
  // vMax = view count at the fromTop boundary (exclude anything MORE popular)
  const vMax = N&&viewFromTop>0   ? vDesc[Math.min(Math.round(viewFromTop/100*(N-1)),N-1)] : null;
  // vMin = view count at the toTop boundary (exclude anything LESS popular)
  const vMin = N&&viewToTop<100   ? vDesc[Math.min(Math.round(viewToTop/100*(N-1)),N-1)]   : null;

  filteredIds=new Set();
  allVideos.forEach((v,i)=>{
    if(i<vidStart||i>=vidEnd) return;
    const okDur  = v.duration==null||(v.duration/60>=durMin&&(durMax>=sMax||v.duration/60<=durMax));
    const okView = v.viewCount==null||((vMax===null||v.viewCount<=vMax)&&(vMin===null||v.viewCount>=vMin));
    if(okDur&&okView) filteredIds.add(v.id);
  });
  // Build selected: filter result + manual inclusions - manual exclusions
  selected = new Set([
    ...[...filteredIds].filter(id => !manualOff.has(id)),
    ...manualOn
  ]);
  updateVidHandles();
  renderList();
  updateStats();
}

// ── Latest 10h ────────────────────────────────────────────────────────────────
function selectLatestHours(hours) {
  const target=hours*3600;
  let total=0, end=0;
  for(const v of allVideos){
    if(total>=target) break;
    total+=(v.duration!=null?v.duration:0);
    end++;
    // Safety: if we've added 500 videos and still no duration data, stop
    if(end>=500&&total===0) { end=Math.min(10,allVideos.length); break; }
  }
  vidStart=0; vidEnd=Math.max(1,Math.min(end,allVideos.length));
  updateVidHandles();
  applyFilters();
}

// ── Selection ─────────────────────────────────────────────────────────────────
function toggleSel(id) {
  if(selected.has(id)) {
    // turning OFF
    selected.delete(id);
    manualOff.add(id);
    manualOn.delete(id);
  } else {
    // turning ON — works even if outside the filter
    selected.add(id);
    manualOn.add(id);
    manualOff.delete(id);
  }
  updateVidHandles();
  renderList();
  updateStats();
}

function toggleSort() {
  sortLongest=!sortLongest;
  document.getElementById('sort-btn').classList.toggle('active',sortLongest);
  renderList();
}

function toggleStreams() {
  streamsOnly=!streamsOnly;
  document.getElementById('streams-btn').classList.toggle('active',streamsOnly);
  renderList();
}

// ── Render ────────────────────────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function fmtDurYT(secs){
  if(!secs) return '';
  const h=Math.floor(secs/3600),m=Math.floor((secs%3600)/60),s=Math.floor(secs%60);
  return h>0?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;
}

function badgeHTML(s){
  if(s==='fetching') return '<span class="badge fetching">fetching…</span>';
  if(s==='done')     return '<span class="badge done">✓ done</span>';
  if(s==='error')    return '<span class="badge error">✗ failed</span>';
  return '';
}

function cardHTML(v,i){
  const sel=selected.has(v.id);
  const excl=!sel;
  const ytUrl=`https://youtube.com/watch?v=${v.id}`;
  const dur=fmtDurYT(v.duration);
  return `<div class="vcard ${v.status}${sel?' selected':''}${excl?' excluded':''}" id="c-${v.id}" onclick="toggleSel('${v.id}')">
  <input type="checkbox" ${sel?'checked':''} onclick="event.stopPropagation();toggleSel('${v.id}')">
  <div class="thumb-wrap" onclick="event.stopPropagation();window.open('${ytUrl}','_blank')">
    <img class="thumb" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" loading="lazy" alt="">
    ${dur?`<span class="thumb-dur">${dur}</span>`:''}
  </div>
  <div class="vinfo">
    <div class="vtitle">${esc(v.title)}</div>
    ${v.views?`<div style="font-size:15px;color:var(--text-faint);margin-bottom:2px">${esc(v.views)}</div>`:''}
    <div class="vmeta">${badgeHTML(v.status)}</div>
    ${v.text  ?`<div class="vpreview">${esc(v.text.substring(0,180))}…</div>`:''}
    ${v.error ?`<div class="verr">${esc(v.error)}</div>`:''}
  </div>
  <div class="vactions" onclick="event.stopPropagation()">
    ${v.status==='done'?`
      <button class="btn sm" onclick="dlOne(${i})">⤓ Save</button>
      <button class="btn sm" onclick="cpOne(${i})" id="cp-${v.id}">⎘ Copy</button>
    `:v.status==='fetching'?'':v.status==='error'?`
      <button class="btn sm" onclick="fetchOne(${i})">↻ Retry</button>
    `:`
      <button class="btn sm primary" onclick="fetchOne(${i})">Fetch</button>
    `}
  </div>
</div>`;
}

function renderList(){
  let list=[...videos];
  if(streamsOnly) list=list.filter(v=>v.isStream);
  if(sortLongest) list=list.slice().sort((a,b)=>(b.duration||0)-(a.duration||0));
  document.getElementById('vlist').innerHTML=list.map((v,i)=>cardHTML(v,i)).join('');
}

function refreshCard(i){
  const v=videos[i],el=document.getElementById('c-'+v.id);
  if(el) el.outerHTML=cardHTML(v,i);
}

function updateStats(){
  const selSecs=videos.filter(v=>selected.has(v.id)&&v.duration).reduce((a,v)=>a+v.duration,0);
  const h=Math.floor(selSecs/3600),m=Math.floor((selSecs%3600)/60);
  const ds=selSecs?(h>0?`${h}h ${m}m`:`${m}m`):'';
  document.getElementById('sel-duration').textContent=
    ds?`${selected.size} videos · ${ds}`:(selected.size?`${selected.size} videos`:'0 videos');
  const done=videos.filter(v=>v.status==='done').length;
  const err=videos.filter(v=>v.status==='error').length;
  document.getElementById('done-val').textContent=done;
  document.getElementById('err-val').textContent=err;
  document.getElementById('done-stat').hidden=done===0;
  document.getElementById('err-stat').hidden=err===0;
  document.getElementById('retry-btn').hidden=err===0;
  const fetching=videos.filter(v=>v.status==='fetching').length;
  const allDone=done>0&&fetching===0;
  document.getElementById('dl-txt-btn').hidden=!allDone;
  document.getElementById('dl-zip-btn').hidden=!allDone;
  document.getElementById('copy-btn').hidden=!allDone;
  const attempted=videos.filter(v=>v.status==='done'||v.status==='error'||v.status==='fetching'||selected.has(v.id)).length;
  document.getElementById('prog-fill').style.width=attempted?`${((done+err)/attempted)*100}%`:'0%';
}

// ── Fetching ──────────────────────────────────────────────────────────────────
async function getTranscript(videoId){
  const res=await fetch(`/api/transcript?v=${videoId}`);
  const data=await res.json();
  if(!res.ok||data.error) throw new Error(data.error||`HTTP ${res.status}`);
  // Strip [0.16s] style timestamp markers from transcript text
  if(data.text) data.text = data.text.replace(/\[\d+(?:\.\d+)?s\]/g,'').replace(/\s{2,}/g,' ').trim();
  return data;
}

async function runBatch(indices){
  const CONCURRENCY=5; let pos=0;
  async function worker(){
    while(pos<indices.length){
      const i=indices[pos++];
      videos[i]={...videos[i],status:'fetching',error:null}; refreshCard(i); updateStats();
      let lastErr='';
      for(let attempt=0; attempt<5; attempt++){
        try{
          const r=await getTranscript(videos[i].id);
          videos[i]={...videos[i],title:videos[i].title||r.title||videos[i].id,text:r.text,lang:r.lang,kind:r.kind,status:'done',error:null};
          lastErr=''; break;
        }catch(e){
          lastErr=e.message;
          if(attempt<4) await new Promise(r=>setTimeout(r,2000*Math.pow(2,attempt))); // 2s,4s,8s,16s
        }
      }
      if(lastErr) videos[i]={...videos[i],status:'error',error:lastErr};
      refreshCard(i); updateStats();
    }
  }
  await Promise.all(Array.from({length:Math.min(CONCURRENCY,indices.length)},worker));
}

async function fetchSelected(){
  const indices=videos.map((v,i)=>selected.has(v.id)&&v.status!=='done'?i:-1).filter(i=>i>=0);
  if(!indices.length) return;
  indices.forEach(i=>{videos[i]={...videos[i],status:'fetching',error:null};refreshCard(i);});
  updateStats();
  const btn=document.getElementById('fetch-btn');
  btn.disabled=true; btn.textContent='⏵ Fetching…';
  await runBatch(indices);
  btn.disabled=false; btn.textContent='▶ Fetch Selected';
}

async function retryFailed(){ await runBatch(videos.map((v,i)=>v.status==='error'?i:-1).filter(i=>i>=0)); }
async function fetchOne(i){
  const v=videos[i];
  // Auto-mark the video if it's currently unselected
  if(!selected.has(v.id)){
    selected.add(v.id);
    manualOn.add(v.id);
    manualOff.delete(v.id);
    updateVidHandles();
    renderList();
    updateStats();
  }
  await runBatch([i]);
}

// ── Filter label for filenames & headers ──────────────────────────────────────
function getActiveFilterLabel() {
  const parts = [];
  const sMax = parseInt(document.getElementById('dur-max').max) || 180;
  if (viewFromTop > 0 || viewToTop < 100) parts.push(getViewLabel());
  if (durMin > 0 || durMax < sMax) {
    if (durMin === 0)        parts.push(`Max ${durMax}min`);
    else if (durMax >= sMax) parts.push(`Min ${durMin}min`);
    else                     parts.push(`${durMin}–${durMax}min`);
  }
  return parts.join(', ');
}

function buildHeader(done) {
  const filterLabel = getActiveFilterLabel();
  const totalSecs = done.reduce((a,v)=>a+(v.duration||0),0);
  const h=Math.floor(totalSecs/3600),m=Math.floor((totalSecs%3600)/60);
  const durStr = totalSecs ? (h>0?`${h}h ${m}m`:`${m}m`) : '';
  let header = `Channel: ${channelName}\nVideos: ${done.length}${durStr?' | Duration: '+durStr:''}`;
  if (filterLabel) header += `\nFilter: ${filterLabel}`;
  header += `\nDate: ${new Date().toISOString().slice(0,10)}`;
  return header + '\n' + '='.repeat(60);
}

function safeName(s) { return s.replace(/[^a-zA-Z0-9 \-_]/g,'').substring(0,60).trim(); }

function buildFilename(ext, done) {
  const filter = getActiveFilterLabel();
  const base = [channelName, filter, `${done.length} videos`].filter(Boolean).join(' — ');
  return base + '.' + ext;
}

// ── Downloads ─────────────────────────────────────────────────────────────────
function getViewsRank(v) {
  // Rank within all loaded videos sorted by view count descending
  const sorted = [...allVideos].filter(x=>x.viewCount!=null).sort((a,b)=>b.viewCount-a.viewCount);
  if (!sorted.length || v.viewCount==null) return null;
  const rank = sorted.findIndex(x=>x.id===v.id) + 1;
  return { rank, total: allVideos.length };
}

function fmt(v) {
  const r = getViewsRank(v);
  const viewsLine = v.views || r ? `Views: ${v.views||'unknown'}${r ? `  (Rank: ${r.rank} of ${r.total})` : ''}\n` : '';
  return `Title: ${v.title}\n${viewsLine}\nTranscript:\n${v.text}`;
}
function dlOne(i){const v=videos[i];if(!v.text)return;dl(fmt(v),v.id+'.txt');}

function downloadTxt(){
  const done=videos.filter(v=>v.status==='done');if(!done.length)return;
  const body = buildHeader(done) + '\n\n' + done.map(v=>fmt(v)).join('\n\n---\n\n');
  dl(body, buildFilename('txt', done));
}

async function downloadZip(){
  const done=videos.filter(v=>v.status==='done');if(!done.length)return;
  const zip=new JSZip();
  const header = buildHeader(done);
  done.forEach(v=>{
    const n=safeName(v.title||v.id)||v.id;
    zip.file(`${n}.txt`, fmt(v));
  });
  zip.file('_summary.txt', header + '\n\n' + done.map(v=>`- ${v.title}`).join('\n'));
  dl(await zip.generateAsync({type:'blob'}), buildFilename('zip', done), true);
}

function dl(content,filename,isBlob=false){
  const blob=isBlob?content:new Blob([content],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

async function cpOne(i){
  const v=videos[i];if(!v.text)return;
  await navigator.clipboard.writeText(fmt(v));
  const btn=document.getElementById('cp-'+v.id);
  if(btn){const o=btn.innerHTML;btn.innerHTML='✓';setTimeout(()=>btn.innerHTML=o,1500);}
}

async function copyAll(){
  const done=videos.filter(v=>v.status==='done');if(!done.length)return;
  const body = buildHeader(done) + '\n\n' + done.map(v=>fmt(v)).join('\n\n---\n\n');
  await navigator.clipboard.writeText(body);
  const btn=document.getElementById('copy-btn');
  const o=btn.innerHTML;btn.innerHTML='✓ Copied!';setTimeout(()=>btn.innerHTML=o,1500);
}
</script>
