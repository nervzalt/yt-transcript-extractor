<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Transcript Extractor</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0b;--surface:#131316;--surface-hi:#1c1c21;
  --border:#26262b;--border-hi:#3a3a42;
  --text:#e8e8ea;--text-dim:#8a8a92;--text-faint:#5a5a62;
  --accent:#00e585;--accent-dim:#00b36a;
  --danger:#ff5555;--warn:#ffb347;
}
body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;font-size:20px;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:24px}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;letter-spacing:.02em}
.logo-mark{width:22px;height:22px;background:var(--accent);color:#000;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.card-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-label{font-size:16px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;font-weight:500}
.card-body{padding:20px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:9px 17px;border:1px solid var(--border-hi);border-radius:6px;background:transparent;color:var(--text);font-family:inherit;font-size:17px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--surface-hi);border-color:var(--text-dim)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}
.btn.primary:hover{background:var(--accent-dim);border-color:var(--accent-dim)}
.btn.sm{padding:6px 13px;font-size:16px}
.btn.ghost{border-color:transparent;color:var(--text-dim)}
.btn.ghost:hover{color:var(--text);border-color:var(--border)}

/* Inputs */
input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px 16px;color:var(--text);font-family:inherit;font-size:17px;outline:none;transition:border-color .15s}
input[type=text]:focus,textarea:focus{border-color:var(--accent-dim)}
textarea{min-height:110px;resize:vertical}

/* Tabs */
.tabs{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;width:fit-content;margin-bottom:14px}
.tab{padding:8px 18px;font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text-dim);transition:all .15s}
.tab.active{background:var(--text);color:var(--bg);font-weight:700}

/* Progress */
.prog{height:2px;background:var(--bg)}
.prog-fill{height:100%;background:var(--accent);width:0%;transition:width .4s}

/* Badges */
.badge{padding:2px 7px;border-radius:99px;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.badge.idle{background:rgba(138,138,146,.15);color:var(--text-faint)}
.badge.fetching{background:rgba(255,179,71,.15);color:var(--warn)}
.badge.done{background:rgba(0,229,133,.15);color:var(--accent)}
.badge.error{background:rgba(255,85,85,.15);color:var(--danger)}

/* Dual range slider */
.dual-slider{position:relative;height:36px;display:flex;align-items:center}
.dual-slider-bg{position:absolute;left:0;right:0;height:4px;background:var(--border-hi);border-radius:2px}
.dual-slider-fill{position:absolute;height:4px;background:var(--accent);border-radius:2px;pointer-events:none}
.dual-slider input[type=range]{position:absolute;width:100%;height:4px;background:transparent;-webkit-appearance:none;appearance:none;pointer-events:none;outline:none}
.dual-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);cursor:pointer;pointer-events:all;box-shadow:0 0 0 1px var(--accent-dim)}
.dual-slider input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);cursor:pointer;pointer-events:all;box-shadow:0 0 0 1px var(--accent-dim)}

/* Segmented track */
.seg-track{display:flex;gap:1px;height:10px;border-radius:4px;overflow:hidden;margin-bottom:4px}
.seg-track div{transition:background .2s;min-width:1px}

/* Stats row */
.stats-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:16px;color:var(--text-dim)}
.stats-row .val{color:var(--text);font-weight:600}
.stats-row .val.green{color:var(--accent)}
.stats-row .val.red{color:var(--danger)}

/* Video list */
.vlist{display:flex;flex-direction:column;gap:12px;padding:10px}
.vlist:empty::after{content:'No videos';display:block;padding:40px;text-align:center;color:var(--text-faint);font-size:17px}

/* Video card */
.vcard{display:grid;grid-template-columns:20px 104px 1fr auto;gap:12px;align-items:center;padding:14px 18px;border:1px solid var(--border);border-radius:8px;background:var(--surface);transition:border-color .15s,background .15s;cursor:pointer}
.vcard:hover{background:var(--surface-hi)}
.vcard.selected{border-color:rgba(0,229,133,.3);background:rgba(0,229,133,.03)}
.vcard.done{border-color:rgba(0,229,133,.18)}
.vcard.error{border-color:rgba(255,85,85,.18)}
.vcard.fetching{border-color:rgba(255,179,71,.22)}
.vcard input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.thumb{width:100px;height:62px;border-radius:4px;object-fit:cover;background:var(--bg);flex-shrink:0}
.vinfo{min-width:0}
.vtitle{font-size:17px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px}
.vmeta{display:flex;align-items:center;gap:7px;font-size:16px;color:var(--text-faint)}
.vpreview{font-size:16px;color:var(--text-dim);margin-top:4px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.verr{font-size:16px;color:var(--danger);margin-top:3px}
.vactions{display:flex;gap:6px;align-items:center;flex-shrink:0}

/* Action bar */
.action-bar{display:flex;gap:7px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--border);align-items:center}

[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo"><div class="logo-mark">YT</div> TRANSCRIPT EXTRACTOR</div>
</header>

<!-- ── INPUT ── -->
<section id="input-panel" class="card">
  <div class="card-head">
    <span class="card-label">Input</span>
    <span id="extract-status" style="font-size:16px;color:var(--text-faint)"></span>
  </div>
  <div class="card-body">
    <div class="tabs">
      <button class="tab active" id="tab-ch" onclick="switchTab('ch')">Channel URL</button>
      <button class="tab"        id="tab-ur" onclick="switchTab('ur')">Paste URLs</button>
    </div>

    <div id="panel-ch">
      <input id="channel-input" type="text" placeholder="https://www.youtube.com/@YourChannel"
        onkeydown="if(event.key==='Enter')handleChannelFetch()">
      <p style="font-size:16px;color:var(--text-faint);margin-top:8px">Supports @handle · /channel/UC... · /c/name</p>
      <div style="margin-top:12px">
        <button class="btn primary" onclick="handleChannelFetch()" id="ch-btn">▶ Load Channel</button>
      </div>
    </div>

    <div id="panel-ur" style="display:none">
      <textarea id="url-input" placeholder="One YouTube URL per line&#10;&#10;https://youtube.com/watch?v=dQw4w9WgXcQ"></textarea>
      <div style="margin-top:10px;display:flex;gap:12px">
        <button class="btn primary" onclick="handleUrlExtract()">Extract Videos</button>
        <button class="btn ghost" onclick="document.getElementById('url-input').value='https://www.youtube.com/watch?v=dQw4w9WgXcQ\nhttps://www.youtube.com/watch?v=jNQXAC9IVRw'">Example</button>
      </div>
    </div>
  </div>
</section>

<!-- ── RESULTS ── -->
<div id="results-panel" hidden>

  <div class="card">
    <div class="card-head">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn sm ghost" onclick="goBack()">← Back</button>
        <span class="card-label" id="ch-label">Results</span>
      </div>
      <div class="stats-row">
        <span id="done-stat" hidden><span class="val green" id="done-val">0</span> done</span>
        <span id="err-stat"  hidden><span class="val red"   id="err-val">0</span> failed</span>
      </div>
    </div>
    <div class="prog"><div class="prog-fill" id="prog-fill"></div></div>
    <div class="card-body" style="display:flex;flex-direction:column;gap:20px">

      <!-- ⚡ Latest 10 Hours -->
      <div style="display:flex;align-items:center;gap:14px">
        <button class="btn primary" onclick="selectLatestHours(10)">⚡ Latest 10 Hours</button>
        <span id="sel-duration" style="font-size:16px;color:var(--text-dim)"></span>
      </div>

      <!-- Video range -->
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:16px;color:var(--text-dim)">Video range &nbsp;<span id="ch-total" style="color:var(--text);font-weight:600">0</span> total</span>
          <span style="font-size:16px;color:var(--text-dim)">
            <span id="vid-start-label" style="color:var(--accent);font-weight:700">#1</span>
            <span style="color:var(--text-faint)"> → </span>
            <span id="vid-end-label" style="color:var(--accent);font-weight:700">#10</span>
          </span>
        </div>
        <!-- Segmented proportional track -->
        <div class="seg-track" id="seg-track"></div>
        <!-- Dual handles — hidden bg/fill since seg-track is the visual -->
        <div class="dual-slider">
          <div class="dual-slider-bg" style="opacity:0"></div>
          <div class="dual-slider-fill" style="display:none"></div>
          <input type="range" id="vid-start" min="0" max="100" value="0"  step="1" oninput="onVidRange(this,'start')">
          <input type="range" id="vid-end"   min="0" max="100" value="10" step="1" oninput="onVidRange(this,'end')">
        </div>
      </div>

      <!-- Duration filter -->
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:16px;color:var(--text-dim)">Duration filter</span>
          <span style="font-size:16px;color:var(--text-dim)">
            <span id="dur-min-label" style="color:var(--accent);font-weight:700">Any</span>
            <span style="color:var(--text-faint)"> → </span>
            <span id="dur-max-label" style="color:var(--accent);font-weight:700">Any</span>
          </span>
        </div>
        <div class="dual-slider">
          <div class="dual-slider-bg"></div>
          <div class="dual-slider-fill" id="dur-fill"></div>
          <input type="range" id="dur-min" min="0" max="180" value="0"   step="1" oninput="onDurRange(this,'min')">
          <input type="range" id="dur-max" min="0" max="180" value="180" step="1" oninput="onDurRange(this,'max')">
        </div>
        <div style="display:flex;justify-content:space-between;font-size:15px;color:var(--text-faint)">
          <span>0 min</span><span>180 min</span>
        </div>
      </div>

    </div>

    <div class="action-bar">
      <button class="btn primary" id="fetch-btn" onclick="fetchSelected()">▶ Fetch Selected</button>
      <button class="btn" id="retry-btn" onclick="retryFailed()" hidden>↻ Retry Failed</button>
      <div style="margin-left:auto;display:flex;gap:7px">
        <button class="btn" id="dl-txt-btn" onclick="downloadTxt()" hidden>⤓ Download TXT</button>
        <button class="btn" id="dl-zip-btn" onclick="downloadZip()" hidden>⤓ ZIP</button>
        <button class="btn ghost" id="copy-btn" onclick="copyAll()" hidden>⎘ Copy All</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="vlist" id="vlist"></div>
  </div>

</div>
</div>

<script>
let allVideos = [], videos = [], selected = new Set(), channelName = '';
let durMin = 0, durMax = 180;
let vidStart = 0, vidEnd = 10;

// ── Tabs ──────────────────────────────────────────────────────────────────────
function switchTab(t) {
  document.getElementById('panel-ch').style.display = t==='ch'?'':'none';
  document.getElementById('panel-ur').style.display = t==='ur'?'':'none';
  document.getElementById('tab-ch').className='tab'+(t==='ch'?' active':'');
  document.getElementById('tab-ur').className='tab'+(t==='ur'?' active':'');
}

// ── Channel load ──────────────────────────────────────────────────────────────
async function handleChannelFetch() {
  const url = document.getElementById('channel-input').value.trim();
  const statusEl = document.getElementById('extract-status');
  const btn = document.getElementById('ch-btn');
  if (!url) { statusEl.textContent='Paste a channel URL first'; return; }
  btn.disabled=true; btn.textContent='Loading…';
  statusEl.textContent='Fetching…';
  try {
    const res = await fetch(`/api/channel?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    if (!res.ok||data.error) throw new Error(data.error||'Failed');
    channelName = data.channelName || 'Channel';
    allVideos = data.videos.map(v=>({id:v.id,title:v.title,duration:v.duration??null,status:'idle',text:null,error:null,lang:null,kind:null}));
    document.getElementById('ch-total').textContent = allVideos.length;
    document.getElementById('ch-label').textContent = channelName.toUpperCase();
    initVidSlider();
    initDurSlider();
    applyFilters();
    document.getElementById('input-panel').hidden = true;
    document.getElementById('results-panel').hidden = false;
    statusEl.textContent = '';
  } catch(e) {
    statusEl.textContent = '✗ '+e.message;
  } finally {
    btn.disabled=false; btn.textContent='▶ Load Channel';
  }
}

// ── URL paste ─────────────────────────────────────────────────────────────────
function handleUrlExtract() {
  const ids = extractIds(document.getElementById('url-input').value);
  if (!ids.length) { document.getElementById('extract-status').textContent='No URLs found'; return; }
  channelName='Videos';
  allVideos = ids.map(id=>({id,title:id,duration:null,status:'idle',text:null,error:null,lang:null,kind:null}));
  document.getElementById('ch-total').textContent = allVideos.length;
  document.getElementById('ch-label').textContent = 'VIDEOS';
  initVidSlider();
  initDurSlider();
  applyFilters();
  document.getElementById('input-panel').hidden=true;
  document.getElementById('results-panel').hidden=false;
}

function extractIds(input) {
  const ids=new Set();
  const patterns=[
    /(?:youtube\.com\/(?:watch\?(?:[^"'&\s]*&)*v=|embed\/|shorts\/|v\/|live\/)|youtu\.be\/|(?:^|[^a-zA-Z0-9])\/watch\?v=)([a-zA-Z0-9_-]{11})/g,
    /"videoId"\s*:\s*"([a-zA-Z0-9_-]{11})"/g,
    /^([a-zA-Z0-9_-]{11})$/gm,
  ];
  for(const re of patterns){let m;while((m=re.exec(input))!==null)ids.add(m[1]);}
  return[...ids];
}

function goBack() {
  document.getElementById('results-panel').hidden=true;
  document.getElementById('input-panel').hidden=false;
  allVideos=[];videos=[];selected=new Set();channelName='';
  document.getElementById('seg-track').innerHTML='';
}

// ── Video range slider ────────────────────────────────────────────────────────
function initVidSlider() {
  const n = allVideos.length;
  vidStart = 0;
  vidEnd = Math.min(10, n);
  const s = document.getElementById('vid-start');
  const e = document.getElementById('vid-end');
  s.max = n; s.value = 0;
  e.max = n; e.value = vidEnd;
  document.getElementById('vid-start-label').textContent = '#1';
  document.getElementById('vid-end-label').textContent = '#' + vidEnd;
}

function onVidRange(el, which) {
  let s = parseInt(document.getElementById('vid-start').value);
  let e = parseInt(document.getElementById('vid-end').value);
  if (s >= e) {
    if (which === 'start') s = Math.max(0, e - 1);
    else e = Math.min(allVideos.length, s + 1);
  }
  vidStart = s; vidEnd = e;
  document.getElementById('vid-start').value = s;
  document.getElementById('vid-end').value = e;
  document.getElementById('vid-start-label').textContent = '#' + (s + 1);
  document.getElementById('vid-end-label').textContent = '#' + e;
  applyFilters();
}

// ── Segmented track ───────────────────────────────────────────────────────────
function renderSegTrack() {
  const track = document.getElementById('seg-track');
  if (!allVideos.length) { track.innerHTML=''; return; }
  const totalDur = allVideos.reduce((a,v) => a + (v.duration || 60), 0);
  track.innerHTML = allVideos.map((v, i) => {
    const flex = ((v.duration || 60) / totalDur * 1000).toFixed(2);
    const inRange = i >= vidStart && i < vidEnd;
    const passesDur = v.duration == null ||
      (v.duration/60 >= durMin && (durMax >= 180 || v.duration/60 <= durMax));
    const bg = !inRange ? 'var(--surface-hi)' : !passesDur ? 'var(--border-hi)' : 'var(--accent)';
    return `<div style="flex:${flex};background:${bg}"></div>`;
  }).join('');
}

// ── Duration range slider ─────────────────────────────────────────────────────
function onDurRange(el, which) {
  let mn = parseInt(document.getElementById('dur-min').value);
  let mx = parseInt(document.getElementById('dur-max').value);
  if (mn > mx) { if (which==='min') mn=mx; else mx=mn; }
  durMin=mn; durMax=mx;
  document.getElementById('dur-min').value=mn;
  document.getElementById('dur-max').value=mx;
  document.getElementById('dur-min-label').textContent = mn===0 ? 'Any' : mn+' min';
  document.getElementById('dur-max-label').textContent = mx===180 ? 'Any' : mx+' min';
  const fill=document.getElementById('dur-fill');
  fill.style.left=(mn/180*100)+'%';
  fill.style.width=((mx-mn)/180*100)+'%';
  applyFilters();
}

function initDurSlider() {
  durMin=0; durMax=180;
  document.getElementById('dur-min').value=0;
  document.getElementById('dur-max').value=180;
  document.getElementById('dur-min-label').textContent='Any';
  document.getElementById('dur-max-label').textContent='Any';
  document.getElementById('dur-fill').style.left='0%';
  document.getElementById('dur-fill').style.width='100%';
}

// ── Apply filters ─────────────────────────────────────────────────────────────
function applyFilters() {
  const prevMap={};
  videos.forEach(v => { prevMap[v.id]=v; });
  videos = allVideos.map(v => prevMap[v.id] || v);

  selected = new Set();
  allVideos.forEach((v, i) => {
    if (i < vidStart || i >= vidEnd) return;
    const passesDur = v.duration == null ||
      (v.duration/60 >= durMin && (durMax >= 180 || v.duration/60 <= durMax));
    if (passesDur) selected.add(v.id);
  });

  renderSegTrack();
  renderList();
  updateStats();
}

// ── Latest 10h ────────────────────────────────────────────────────────────────
function selectLatestHours(hours) {
  const target = hours * 3600;
  let total = 0, endIdx = 0;
  for (const v of allVideos) {
    if (total >= target) break;
    total += v.duration || 0;
    endIdx++;
  }
  vidStart = 0;
  vidEnd = endIdx;
  document.getElementById('vid-start').value = 0;
  document.getElementById('vid-end').value = endIdx;
  document.getElementById('vid-start-label').textContent = '#1';
  document.getElementById('vid-end-label').textContent = '#' + endIdx;
  applyFilters();
}

// ── Selection ─────────────────────────────────────────────────────────────────
function toggleSel(id) {
  if(selected.has(id)) selected.delete(id); else selected.add(id);
  const card=document.getElementById('c-'+id);
  if(card){
    card.classList.toggle('selected',selected.has(id));
    const cb=card.querySelector('input[type=checkbox]');
    if(cb) cb.checked=selected.has(id);
  }
  updateStats();
}

function syncCheckboxes() {
  videos.forEach(v=>{
    const card=document.getElementById('c-'+v.id);
    if(!card) return;
    const isSel=selected.has(v.id);
    card.classList.toggle('selected',isSel);
    const cb=card.querySelector('input[type=checkbox]');
    if(cb) cb.checked=isSel;
  });
}

// ── Render ────────────────────────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function fmtDur(secs){
  if(!secs) return '';
  const m=Math.floor(secs/60), s=secs%60, h=Math.floor(m/60);
  if(h>0) return `${h}h ${m%60}m`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function badgeHTML(s){
  if(s==='idle')     return '<span class="badge idle">idle</span>';
  if(s==='fetching') return '<span class="badge fetching">fetching…</span>';
  if(s==='done')     return '<span class="badge done">✓ done</span>';
  if(s==='error')    return '<span class="badge error">✗ failed</span>';
  return '';
}

function cardHTML(v,i){
  const sel=selected.has(v.id);
  return `<div class="vcard ${v.status}${sel?' selected':''}" id="c-${v.id}" onclick="toggleSel('${v.id}')">
  <input type="checkbox" ${sel?'checked':''} onclick="event.stopPropagation();toggleSel('${v.id}')">
  <img class="thumb" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" loading="lazy" alt="">
  <div class="vinfo">
    <div class="vtitle">${esc(v.title)}</div>
    <div class="vmeta">
      ${badgeHTML(v.status)}
      ${v.duration?`<span>· ${fmtDur(v.duration)}</span>`:''}
    </div>
    ${v.text  ?`<div class="vpreview">${esc(v.text.substring(0,180))}…</div>`:''}
    ${v.error ?`<div class="verr">${esc(v.error)}</div>`:''}
  </div>
  <div class="vactions" onclick="event.stopPropagation()">
    <a href="https://youtube.com/watch?v=${v.id}" target="_blank" onclick="event.stopPropagation()"
      class="btn sm ghost" style="text-decoration:none">↗ Open</a>
    ${v.status==='done'?`
      <button class="btn sm" onclick="dlOne(${i})">⤓ Save</button>
      <button class="btn sm" onclick="cpOne(${i})" id="cp-${v.id}">⎘ Copy</button>
    `:v.status==='fetching'?'':v.status==='error'?`
      <button class="btn sm" onclick="fetchOne(${i})">↻ Retry</button>
    `:`
      <button class="btn sm primary" onclick="fetchOne(${i})">Fetch</button>
    `}
  </div>
</div>`;
}

function renderList(){
  document.getElementById('vlist').innerHTML=videos.map((v,i)=>cardHTML(v,i)).join('');
}

function refreshCard(i){
  const v=videos[i];
  const el=document.getElementById('c-'+v.id);
  if(el) el.outerHTML=cardHTML(v,i);
}

function updateStats(){
  const selSecs=videos.filter(v=>selected.has(v.id)&&v.duration).reduce((a,v)=>a+v.duration,0);
  const selH=Math.floor(selSecs/3600), selM=Math.floor((selSecs%3600)/60);
  const durStr=selSecs?(selH>0?`${selH}h ${selM}m`:`${selM}m`):'';
  document.getElementById('sel-duration').textContent=
    durStr ? `${selected.size} videos · ${durStr}` : (selected.size ? `${selected.size} videos` : '');
  const done=videos.filter(v=>v.status==='done').length;
  const err=videos.filter(v=>v.status==='error').length;
  const comp=done+err;
  document.getElementById('done-val').textContent=done;
  document.getElementById('err-val').textContent=err;
  document.getElementById('done-stat').hidden=done===0;
  document.getElementById('err-stat').hidden=err===0;
  document.getElementById('retry-btn').hidden=err===0;
  document.getElementById('dl-txt-btn').hidden=done===0;
  document.getElementById('dl-zip-btn').hidden=done===0;
  document.getElementById('copy-btn').hidden=done===0;
  document.getElementById('prog-fill').style.width=videos.length?`${(comp/videos.length)*100}%`:'0%';
}

// ── Fetching ──────────────────────────────────────────────────────────────────
async function getTranscript(videoId){
  const res=await fetch(`/api/transcript?v=${videoId}`);
  const data=await res.json();
  if(!res.ok||data.error) throw new Error(data.error||`HTTP ${res.status}`);
  return data;
}

async function runBatch(indices){
  const CONCURRENCY=5;
  let pos=0;
  async function worker(){
    while(pos<indices.length){
      const i=indices[pos++];
      videos[i]={...videos[i],status:'fetching',error:null};
      refreshCard(i); updateStats();
      try{
        const r=await getTranscript(videos[i].id);
        videos[i]={...videos[i],title:videos[i].title||r.title||videos[i].id,text:r.text,lang:r.lang,kind:r.kind,status:'done',error:null};
      }catch(e){
        videos[i]={...videos[i],status:'error',error:e.message};
      }
      refreshCard(i); updateStats();
    }
  }
  await Promise.all(Array.from({length:Math.min(CONCURRENCY,indices.length)},worker));
}

async function fetchSelected(){
  const indices=videos.map((v,i)=>selected.has(v.id)&&v.status!=='done'?i:-1).filter(i=>i>=0);
  if(!indices.length) return;
  indices.forEach(i=>{ videos[i]={...videos[i],status:'fetching',error:null}; refreshCard(i); });
  updateStats();
  const btn=document.getElementById('fetch-btn');
  btn.disabled=true; btn.textContent='⏵ Fetching…';
  await runBatch(indices);
  btn.disabled=false; btn.textContent='▶ Fetch Selected';
}

async function retryFailed(){
  await runBatch(videos.map((v,i)=>v.status==='error'?i:-1).filter(i=>i>=0));
}

async function fetchOne(i){ await runBatch([i]); }

// ── Downloads ─────────────────────────────────────────────────────────────────
function fmt(v){return`Title: ${v.title}\n\nTranscript:\n${v.text}`;}

function dlOne(i){
  const v=videos[i]; if(!v.text) return;
  dl(fmt(v), v.id+'.txt');
}

function downloadTxt(){
  const done=videos.filter(v=>v.status==='done'); if(!done.length) return;
  dl(done.map(v=>fmt(v)).join('\n\n---\n\n'), `${channelName} ${done.length} video transcripts.txt`);
}

async function downloadZip(){
  const done=videos.filter(v=>v.status==='done'); if(!done.length) return;
  const zip=new JSZip();
  done.forEach(v=>{
    const name=(v.title||v.id).replace(/[^a-zA-Z0-9 \-_]/g,'').substring(0,60).trim()||v.id;
    zip.file(`${name}.txt`, fmt(v));
  });
  dl(await zip.generateAsync({type:'blob'}), `${channelName} transcripts.zip`, true);
}

function dl(content, filename, isBlob=false){
  const blob=isBlob?content:new Blob([content],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

async function cpOne(i){
  const v=videos[i]; if(!v.text) return;
  await navigator.clipboard.writeText(fmt(v));
  const btn=document.getElementById('cp-'+v.id);
  if(btn){const o=btn.innerHTML;btn.innerHTML='✓';setTimeout(()=>btn.innerHTML=o,1500);}
}

async function copyAll(){
  const done=videos.filter(v=>v.status==='done'); if(!done.length) return;
  await navigator.clipboard.writeText(done.map(v=>`---\n\nTitle: ${v.title}\n\nTranscript:\n${v.text}`).join('\n\n'));
  const btn=document.getElementById('copy-btn');
  const o=btn.innerHTML; btn.innerHTML='✓ Copied!';
  setTimeout(()=>btn.innerHTML=o,1500);
}
</script>
